[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-backend"
version = "0.1.0"
description = "Lumen — Personal Financial Intelligence Agent, backend"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
	"free_tier_live: hits a real free-tier LLM endpoint; skipped by default. Enable with `pytest -m free_tier_live`.",
]
# Live-provider tests are opt-in via marker; default runs stay hermetic.
addopts = "-m 'not free_tier_live'"

